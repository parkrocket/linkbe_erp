name: Deploy React App to EC2

# 2026-11-02 hibye.kr이 새 앱(hibye-web)으로 전환 → 자동 배포 중지, 되돌리기용 수동 실행만 (2주 후 정리)
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install dependencies
              run: |
                  cd react-app
                  npm install # sass·babel 플러그인은 package.json에 포함됨

            - name: Build React app
              env:
                  CI: false
              run: cd react-app && npm run build

            - name: Deploy to EC2
              env:
                  HOST: ${{ secrets.EC2_HOST }}
                  USERNAME: ${{ secrets.EC2_USER }}
                  KEY: ${{ secrets.EC2_KEY }}
                  PORT: ${{ secrets.EC2_PORT }}
              run: |
                  echo "${KEY}" > key.pem
                  chmod 400 key.pem
                  scp -o StrictHostKeyChecking=no -i key.pem -r react-app/build/* $USERNAME@$HOST:/var/www/html/
                  ssh -o StrictHostKeyChecking=no -i key.pem $USERNAME@$HOST "sudo systemctl restart nginx"
